# Rotina diária: baixa os dados, grava no repositório e publica o site.
name: Atualizar dados e publicar site

on:
  schedule:
    # Todo dia às 12:00 UTC (= 09:00 em Brasília). O horário do cron é sempre UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:   # cria um botão "Run workflow" para rodar na mão
  push:
    branches: [main]   # publica também quando você muda o código

# Nenhuma permissão por padrão: cada job abaixo declara só o que precisa.
permissions: {}

# Evita duas execuções ao mesmo tempo brigando pelo mesmo commit.
concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # evita uma execução presa (o padrão seria 6 horas)
    permissions:
      contents: write   # fazer commit do JSON atualizado
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Instalar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"

      - name: Baixar os indicadores
        # Um indicador que falhe mantém o arquivo de ontem e vira um aviso amarelo.
        # Se TODOS falharem, a rotina para aqui: nada é gravado nem publicado,
        # e o site continua com os dados de ontem.
        run: python scripts/coletar.py

      - name: Coletar notícias
        # Falha isolada: se este passo der erro, a execução segue normalmente
        # (indicadores gravados e site publicado). Um feed que falhe mantém os
        # itens da última coleta boa, e a página mostra "não atualizado desde".
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/noticias.py

      - name: Gravar o resultado no repositório
        # Grava todo dia (a data de extração sempre muda). Isso também
        # mantém o repositório "ativo", e o GitHub não desliga o agendamento.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
          else
            # Data e hora de Brasília (o servidor do GitHub usa UTC)
            git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y às %H:%M') (Brasília)"
            git pull --rebase   # caso alguém tenha feito push enquanto rodava
            git push
          fi

      - name: Montar a pasta do site
        # Publica só o necessário: a página, o estilo/JS e os dados (não os scripts).
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data _site/

      - name: Enviar a pasta do site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site

  publicar:
    needs: atualizar          # só roda se o job anterior deu certo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publicar no GitHub Pages
      id-token: write   # exigido pela Action oficial de publicação
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
