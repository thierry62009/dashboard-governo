<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard do Governo Federal</title>
  <style>
    /* Estilo mínimo: fonte do sistema, largura confortável para leitura */
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto;
           padding: 16px; color: #1a1a1a; background: #fff; line-height: 1.5; }
    .cartao { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .valor { font-size: 2.5rem; font-weight: bold; margin: 0; }
    .fonte { font-size: 0.85rem; color: #555; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #eee; padding: 4px 8px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    .erro { color: #b00020; }
  </style>
</head>
<body>
  <h1>Dashboard do Governo Federal</h1>
  <p>Indicadores oficiais desde janeiro de 2023.</p>

  <!-- Cartão do IPCA: o JavaScript abaixo preenche os campos vazios -->
  <section class="cartao" id="ipca">
    <h2 id="ipca-nome">IPCA</h2>
    <p class="valor" id="ipca-valor">carregando…</p>
    <p id="ipca-mes"></p>
    <p class="fonte" id="ipca-fonte"></p>
    <details>
      <summary>Ver todos os meses</summary>
      <table>
        <thead><tr><th>Mês</th><th>Variação (%)</th></tr></thead>
        <tbody id="ipca-tabela"></tbody>
      </table>
    </details>
  </section>

  <script>
    // Converte "2026-09" em "setembro de 2026".
    // Usamos new Date(ano, mês-1, 1) para evitar erro de fuso horário.
    function nomeDoMes(aaaaMm) {
      const [ano, mes] = aaaaMm.split("-").map(Number);
      return new Date(ano, mes - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    }

    // Converte 0.82 em "0,82" (vírgula decimal, sempre 2 casas).
    function numeroBR(v) {
      return v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Cria um elemento <a> com segurança (textContent nunca interpreta HTML).
    function link(texto, url) {
      const a = document.createElement("a");
      a.href = url;
      a.textContent = texto;
      return a;
    }

    async function carregarIpca() {
      // Baixa o JSON gerado pelo script Python (mesma pasta do site).
      const resposta = await fetch("data/ipca.json");
      if (!resposta.ok) throw new Error("não foi possível ler data/ipca.json (HTTP " + resposta.status + ")");
      const json = await resposta.json();

      const s = json.serie;
      const ultimo = json.dados[json.dados.length - 1];   // o mês mais recente

      document.getElementById("ipca-nome").textContent = s.nome;
      document.getElementById("ipca-valor").textContent = numeroBR(ultimo.valor) + "%";
      document.getElementById("ipca-mes").textContent =
        s.unidade + " — " + nomeDoMes(ultimo.data) + " (último mês divulgado)";

      // Bloco de fonte: série, origem, data de extração, link e licença.
      const extraido = new Date(json.extraido_em).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
      const fonte = document.getElementById("ipca-fonte");
      fonte.append(
        "Série SGS " + s.codigo + " · Origem: " + s.origem + " · Fonte: ",
        link(s.fonte, "https://www3.bcb.gov.br/sgspub/"),
        " · Extraído em " + extraido + " · ",
        link("dados da consulta", s.url_fonte),
        " · Licença: " + s.licenca
      );

      // Tabela com todos os meses, do mais recente para o mais antigo.
      const tbody = document.getElementById("ipca-tabela");
      for (const item of [...json.dados].reverse()) {
        const tr = document.createElement("tr");
        const tdMes = document.createElement("td");
        const tdValor = document.createElement("td");
        tdMes.textContent = nomeDoMes(item.data);
        tdValor.textContent = numeroBR(item.valor);
        tr.append(tdMes, tdValor);
        tbody.append(tr);
      }
    }

    // Se algo der errado, mostra a mensagem na página em vez de ficar "carregando…".
    carregarIpca().catch(function (erro) {
      const el = document.getElementById("ipca-valor");
      el.textContent = "Erro ao carregar: " + erro.message;
      el.className = "erro";
    });
  </script>
</body>
</html>
